<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Cold Chain</title>

    <link rel="stylesheet" href="/assets/css/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/assets/css/CyR.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <!-- Librerías para generación de PDF y Gráficas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="sidebar d-flex flex-column justify-content-between text-white">
        <div>
            <div class="d-flex align-items-center gap-3 py-3 border-bottom border-secondary mb-4">
                <img src="images/camion.png" alt="Avatar" class="rounded-circle" style="width: 50px; height: 50px; object-fit: cover; border: 2px solid #334155;">
                <div>
                    <h2 class="m-0 text-white fw-bold" style="letter-spacing: -0.5px;">Cold Chain</h2>
                </div>
            </div>

            <nav id="nav" class="nav flex-column w-100">
                <a href="index.html" class="nav-link-custom">
                    <i class="bi bi-speedometer2 fs-5"></i> Inicio 
                </a>
                <a href="mapa.html" class="nav-link-custom">
                    <i class="bi bi-geo-alt fs-5"></i> Monitoreo de Ruta
                </a>
                <a href="ia.html" class="nav-link-custom">
                    <i class="bi bi-cpu fs-5"></i> Alerta de anomalías 
                </a>
                <div class="restringido-operator w-100">
                    <a href="/catalogo.html" class="nav-link-custom">
                        <i class="bi bi-folder2-open fs-5"></i> Catálogo
                    </a>
                </div>
                <div class="restringido-operator w-100">
                    <a href="reportes.html" class="nav-link-custom active">
                        <i class="bi bi-file-earmark-bar-graph fs-5"></i> Auditoría y Reportes
                    </a>
                </div>
            </nav>
        </div>
        <div class="pt-3 border-top border-secondary mt-4">
            <span class="d-block text-muted fw-bold" style="font-size: 0.8rem; letter-spacing: 0.5px;">TACTICAL SOLUTIONS</span>
        </div>
    </div>

    <div class="main p-4">
        <header class="mb-4">
            <h1>Historial de Viajes</h1>
        </header>

        <div id="tab-historial-body" class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Id Viaje</th>
                        <th>Id Camión</th>
                        <th>Origen</th>
                        <th>Destino</th>
                        <th>Inicio del Viaje</th>
                        <th>Término del Viaje</th>
                        <th>Reporte</th>
                    </tr>
                </thead>
                <tbody id="tabla-historial-body">
                    <!-- Filas renderizadas dinámicamente desde Firebase -->
                    <tr>
                        <td colspan="7" class="text-center text-muted py-4">Cargando registros...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    

    <!-- Canvas oculto para renderizar gráficos térmicos para el PDF -->
    <div style="position: absolute; left: -9999px; top: -9999px;">
        <canvas id="pdfChartCanvas" width="600" height="300"></canvas>
    </div>

    <script type="module" src="/catalogo.js"></script>
    <script type="module" src="/assets/js/auth-guard.js"></script>
    <script type="module" src="/reportes.js"></script>
</body>
</html>
